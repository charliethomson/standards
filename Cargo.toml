[workspace]
resolver = "3"
# Server: core -> db -> engine -> api (docs/service-architecture.md); the cli also
# depends on core. Members land with their tasks.
members = [
    "crates/standards-core",
    "crates/standards-db",
    "crates/standards-engine",
    "crates/standards-api",
    "crates/standards-cli",
]

[workspace.package]
version = "0.0.0"          # placeholder: the real version is derived (docs/versioning.md)
edition = "2024"
license = "UNLICENSED"
publish = false
repository = "https://github.com/charliethomson/standards"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = 0 }
# Allowlist (with the reason each is tolerated):
missing_errors_doc = { level = "allow", priority = 1 } # serializable error enums document themselves
implicit_hasher    = { level = "allow", priority = 1 } # generic hashers add noise without value
panic              = { level = "warn", priority = 1 }   # surface panics; allow case-by-case

[workspace.dependencies]
# ── the lib* ecosystem (docs/lib-ecosystem.md) ──
libbuildinfo = { git = "https://github.com/charliethomson/libbuildinfo" }
libconfig    = { git = "https://github.com/charliethomson/libconfig" }
libpath      = { git = "https://github.com/charliethomson/libpath" }
# libproduct is a member crate of the libpath repo.
libproduct   = { git = "https://github.com/charliethomson/libpath" }
libsignal    = { git = "https://github.com/charliethomson/libsignal" }
# SSH: the liblog repo is private (.cargo/config.toml routes git through the CLI).
liblog       = { git = "ssh://git@github.com/charliethomson/liblog.git" }

# ── internal crates (dependencies point inward only) ──
standards-core   = { path = "crates/standards-core" }
standards-db     = { path = "crates/standards-db" }
standards-engine = { path = "crates/standards-engine" }
standards-api    = { path = "crates/standards-api" }

# ── third-party ──
pulldown-cmark = { version = "0.13", default-features = false }
regex          = "1"
rust-embed     = { version = "8", features = ["include-exclude", "debug-embed"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
sha2           = "0.10"
hex            = "0.4"
thiserror      = "2"
tokio          = { version = "1", features = ["full"] }
# The process-wide shutdown token libsignal cancels on a signal.
tokio-util     = { version = "0.7", default-features = false }
poem           = "3.1"
# MCP over streamable HTTP at /mcp (L30, STD-13): mounted under poem via tower-compat.
rmcp           = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
schemars       = "1.2"
poem-openapi   = { version = "5", features = ["scalar"] }
prometheus-client = "0.25"
# `valuable`: structured error fields (needs the tracing_unstable cfg, .cargo/config.toml).
tracing        = { version = "0.1", features = ["valuable"] }
# ── the cli (standards-cli) ──
clap           = { version = "4", features = ["derive"] }
# Blocking: one request at a time is all a cli invocation needs.
reqwest        = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# self-update unpacks the registry's .tar.gz artifact.
flate2         = "1"
tar            = "0.4"
tempfile       = "3"
