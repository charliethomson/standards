# Komodo Variables for the standards stack: none are declared here.
#
# Keep SECRETS OUT of this file. Komodo's resource sync diffs `value` fields literally, so
# declaring a secret here with `value = ""` overwrites the UI-populated value to empty on
# every sync.
#
# ─── Variables stacks.toml references ────────────────────────────────────────
#
#   GHCR_TOKEN      — secret. GitHub PAT with read:packages, for watchtower's GHCR poll.
#                     Shared with the other stacks: if it already exists, reuse it.
#                     (The daemon's initial pull is authed separately via the ghcr.io
#                     Registry Account in Komodo Settings.)
#
#   STANDARDS_CF_TUNNEL_TOKEN
#                     Secret. The Cloudflare Tunnel token for the `standards` tunnel
#                     (Zero Trust → Networks → Tunnels → standards → install command, the
#                     string after `--token`). Lands in the stack .env as CF_TUNNEL_TOKEN.
#                     Its own Variable, not the homelab's CF_TUNNEL_TOKEN: that one is the
#                     ci.thmsn.dev tunnel.
#
#   HOMELAB_HOST_IP — not secret, already declared by the homelab repo's own sync
#                     (homelab/komodo/sync/variables.toml). Do not re-declare it here.
#
# Reminder: `is_secret` only hides values from the UI/logs; Komodo stores them at rest
# unencrypted — disk security of that volume is the actual protection.
