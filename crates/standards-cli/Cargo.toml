[package]
name = "standards-cli"
description = "The `standards` cli: sets a repo up from the hosted standards server and keeps a machine in step with it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The package is standards-cli; the binary it ships is `standards`
# (dev.thmsn.standards.cli, docs/identifiers.md). Everything lives in the library so
# tests drive it in-process; main.rs is wiring.
[[bin]]
name = "standards"
path = "src/main.rs"

[lints]
workspace = true

# The cli depends on core only, never on the server crates (AGENTS.md).
[dependencies]
standards-core = { workspace = true }

libconfig  = { workspace = true }
libproduct = { workspace = true }

clap       = { workspace = true }
flate2     = { workspace = true }
hex        = { workspace = true }
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
tar        = { workspace = true }
thiserror  = { workspace = true }

# Tests run the real server app in-process on an ephemeral port, and a fake registry
# beside it, both on poem.
[dev-dependencies]
standards-api = { workspace = true }
standards-db  = { workspace = true }
poem          = { workspace = true }
tempfile      = { workspace = true }
tokio         = { workspace = true }
